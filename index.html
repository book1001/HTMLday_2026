@-webkit-keyframes rotating {
  from {
    -webkit-transform: rotate(0deg);
  }
  to {
    -webkit-transform: rotate(360deg);
  }
}


@keyframes rotating {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

/* ========================================
   IFRAME
======================================== */
#overlapIframe {
  position: absolute;
  inset: 0;
  display: none;
  width: calc(100% + 15px);
  height: 100%;
  border: 0;
  background: white;
  z-index: 2;
}

.border {
  width: 100%;
  height: 50px;
  z-index: 2;
  bottom: 0;
  position: absolute;
  background: linear-gradient(0deg, rgba(255, 255, 255, 1) 35%, rgba(255, 255, 255, 0) 100%);
}

/* ========================================
   EDITORIAL TEXT
======================================== */
#editorialText {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}

/* ========================================
   LETTER
======================================== */
.letter {
  position: absolute;
  left: 0;
  top: 0;
  font-family: 'FKGroteskMonoTrial-Regular';
  /* font-family: 'FKGroteskSemiMonoTrial-Regular'; */
  /* font-family: monospace; */
  font-weight: 400;
  line-height: 1;
  white-space: pre;
  color: #6ff304;
  transition: color 1.5s ease;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  pointer-events: auto;
  user-select: none;
  cursor: default;
  will-change:
    left,
    top,
    font-size,
    color;
}

/* ========================================
   TEXT SOURCES
======================================== */
#textSources {
  display: none;
}
span {
  font-family: 'FKGroteskSemiMonoTrial-Regular';
  padding-bottom: 7px;
}
/* ========================================
   DEBUG
======================================== */

#debug {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 10;
  white-space: pre;
  pointer-events: none;
}


/* ========================================
   NO-LETTER TEXT MODE
   Each source <span> remains one whole line.
======================================== */
#editorialText {
  pointer-events: none;
  color: #6ff304;
  transition: color 1.5s ease;
}

.text-block {
  position: absolute;
  left: 50%;
  top: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: 'FKGroteskMonoTrial-Regular';
  font-weight: 400;
  line-height: 1;
  white-space: pre;
  color: inherit;
  transform: translate(-50%, -50%);
  transform-origin: center center;
  pointer-events: none;
  user-select: none;
  will-change: left, top, font-size, color;
  transition:
    left 0.35s ease-out,
    top 0.35s ease-out,
    font-size 0.35s ease-out,
    color 1.5s ease;
}

.text-block.is-doctype {
  pointer-events: auto;
  cursor: pointer;
}

.text-line {
  display: block;
  color: inherit;
  transition: color 1.5s ease;
}

</style>
</head>

<!-- ========================================
     OVERLAP
======================================== -->
<div id="overlap">
  <div id="overlapImage" role="img" aria-label=""></div>
  <iframe id="overlapIframe" src=""></iframe>
  <div class="border"></div>
</div>


<!-- ========================================
     GENERATED LETTERS
======================================== -->

<div id="editorialText"></div>

<div id="textSources">
  <!--
  최초 화면
  이 텍스트를 클릭하면 두 번째 브라우저가 열린다.
  -->
  <div id="text-doctype">
    <span>&lt;!DOCTYPE html&gt;</span>
  </div>

  <!--
  첫 번째 브라우저
  overlap 이전
  -->
  <div id="text-html-open">
    <span>&lt;html&gt;</span>
  </div>

  <!--
  두 번째 브라우저
  overlap 이전
  -->
  <div id="text-html-close">
    <span>&lt;/html&gt;</span>
  </div>

  <!--
  horizontal overlap
  첫 번째
  -->
  <div id="text-a-open">
    <span>&lt;a&gt;</span>
  </div>

  <!--
  horizontal overlap
  두 번째
  -->
  <div id="text-a-close">
    <span>&lt;/a&gt;</span>
  </div>

  <!--
  vertical overlap
  위쪽 browser
  -->
  <div id="text-vertical-top">
    <span>&lt;head&gt;</span>
    <span>&lt;title&gt;html energy&lt;/title&gt;</span>
    <span>&lt;/head&gt;</span>
    <span>&lt;body&gt;</span>
    <span>&lt;a&gt;</span>
  </div>

  <!--
  vertical overlap
  아래쪽 browser
  -->
  <div id="text-vertical-bottom">
    <span>&lt;/a&gt;</span>
    <span>&lt;/body&gt;</span>
  </div>
</div>

<div id="debug"></div>
